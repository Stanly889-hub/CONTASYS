<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Configuración - CONTASYS</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="icon" href="css/marca/favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="css/corporativo.css">
<link rel="stylesheet" href="css/operaciones.css">
<link rel="stylesheet" href="css/administracion.css">
</head>
<body class="cs-ui cs-dashboard cs-modulo cs-administracion">

<div class="dashboard-container">

    <aside class="sidebar" id="menuFinanciero"></aside>

    <main class="main-content">
        <header class="topbar"></header>
        <div class="cs-dashboard-content">
        <div class="cs-module-hero"><div class="cs-module-hero-mark"><svg class="ui-icon" width="18" height="18" aria-hidden="true"><use href="css/iconos.svg#ajustes"></use></svg></div><div><h1>Configuración</h1><p>Gestiona las categorías financieras y los métodos de pago.</p></div></div>

        <div id="contenidoConfiguracion" class="adm-catalogos" hidden>
        <section class="form-section cs-card cs-module-form">
            <h2>Nueva categoría financiera</h2>
            <form id="categoriaForm">
                <div class="row">
                    <label class="cs-module-field">Nombre de la categoría<input type="text" id="nombreCategoria" placeholder="Ej. Ventas" required></label>
                    <label class="cs-module-field">Tipo de categoría<select id="tipoCategoria" required>
                        <option value="">Tipo</option>
                        <option value="Ingreso">Ingreso</option>
                        <option value="Egreso">Egreso</option>
                    </select></label>
                </div>
                <label class="cs-module-field">Descripción (opcional)<input type="text" id="descripcionCategoria" placeholder="Descripción (opcional)"></label>
                <button type="submit" class="cs-button cs-button-primary"><svg class="ui-icon" width="18" height="18" aria-hidden="true"><use href="css/iconos.svg#suma"></use></svg> Crear categoría</button>
            </form>
        </section>

        <section class="cs-card cs-module-ledger adm-ledger">
            <h2>Categorías financieras</h2>
            <p id="estadoCategorías" class="cs-status cs-module-loading" role="status">Cargando registros…</p>
            <div class="cs-table-scroll cs-module-scroll" tabindex="0"><table>
                <thead>
                    <tr><th>Código</th><th>Nombre</th><th>Tipo</th><th>Estado</th><th>Acciones</th></tr>
                </thead>
                <tbody id="tablaCategorias"></tbody>
            </table></div>
        </section>

        <section class="form-section cs-card cs-module-form">
            <h2>Nuevo método de pago</h2>
            <form id="metodoForm">
                <label class="cs-module-field">Nombre del método de pago<input type="text" id="nombreMetodo" placeholder="Nombre del método de pago" required></label>
                <label class="cs-module-field">Descripción (opcional)<input type="text" id="descripcionMetodo" placeholder="Descripción (opcional)"></label>
                <button type="submit" class="cs-button cs-button-primary"><svg class="ui-icon" width="18" height="18" aria-hidden="true"><use href="css/iconos.svg#suma"></use></svg> Crear método de pago</button>
            </form>
        </section>

        <section class="cs-card cs-module-ledger adm-ledger">
            <h2>Métodos de pago</h2>
            <p id="estadoMétodos" class="cs-status cs-module-loading" role="status">Cargando registros…</p>
            <div class="cs-table-scroll cs-module-scroll" tabindex="0"><table>
                <thead>
                    <tr><th>Nombre</th><th>Descripción</th><th>Estado</th><th>Acciones</th></tr>
                </thead>
                <tbody id="tablaMetodos"></tbody>
            </table></div>
        </section>
        </div>
        </div>
        <dialog class="cs-module-dialog" id="confirmacionOperacion" aria-labelledby="tituloConfirmacion" aria-describedby="textoConfirmacion">
            <form method="dialog">
                <h2 id="tituloConfirmacion">Confirmar acción</h2>
                <p id="textoConfirmacion"></p>
                <div class="cs-module-actions"><button class="cs-button cs-button-secondary" value="cancelar" autofocus>Cancelar</button><button class="cs-button cs-button-primary" value="eliminar">Confirmar</button></div>
            </form>
        </dialog>
    </main>
</div>

<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/operaciones-ui.js"></script>
<script src="js/comunicacion-ui.js"></script>
<script src="js/administracion-ui.js"></script>
<script src="js/configuracion.js"></script>
</body>
</html>
