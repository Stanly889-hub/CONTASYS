<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0F172A">
    <title>Gestión financiera para tu negocio | CONTASYS</title>
    <link rel="icon" href="css/marca/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/corporativo.css">
    <link rel="stylesheet" href="css/inicio-sesion.css">
</head>
<body class="bg-finance cs-ui cs-access cs-login">
    <main class="container-center cs-auth-layout">
        <section class="cs-intro" aria-labelledby="tituloPrincipal">
            <svg class="login-wave login-wave-top" viewBox="0 0 320 240" aria-hidden="true">
                <path fill="#2563EB" opacity=".6" d="M0 0h320C241 97 134 189 0 240Z"/>
                <path fill="#60A5FA" opacity=".9" d="M0 0h265C199 86 101 178 0 217Z"/>
            </svg>
            <svg class="login-wave login-wave-bottom" viewBox="0 0 700 142" preserveAspectRatio="none" aria-hidden="true">
                <path fill="#2563EB" opacity=".65" d="M0 32c128-21 218 87 357 47C476 44 564-4 700 14v128H0Z"/>
                <path fill="#60A5FA" opacity=".77" d="M0 27c139-8 222 79 350 74C496 95 559 23 700 75v67H0Z"/>
            </svg>
            <img class="cs-brand-image login-logo" src="css/marca/contasys.png" alt="CONTASYS" width="1144" height="600">
            <h1 id="tituloPrincipal">Las finanzas de tu negocio,<br><em>en un solo lugar.</em></h1>
            <ul class="login-beneficios">
                <li><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="15" height="11" rx="2"/><path d="M9.5 15v4M6 19h5"/><rect x="15" y="10" width="7" height="11" rx="1.5"/></svg><span>Acceso desde diferentes dispositivos.</span></li>
                <li><svg class="ui-icon" aria-hidden="true"><use href="css/iconos.svg#candado"></use></svg><span>Información protegida.</span></li>
                <li><svg class="ui-icon" aria-hidden="true"><use href="css/iconos.svg#activar"></use></svg><span>Fácil de usar.</span></li>
            </ul>
        </section>
        <section class="cs-auth-main" aria-labelledby="tituloFormulario">
            <div class="card-register cs-auth-card">
                <h2 id="tituloFormulario">Iniciar sesión</h2>
                <p>Ingrese sus datos para poder continuar</p>
                <form id="loginForm">

                    <div class="cs-field">
                        <label for="correo">Correo electrónico</label>
                        <div class="cs-field-control">
                            <svg class="ui-icon" aria-hidden="true"><use href="css/iconos.svg#correo"></use></svg>
                            <input type="email" id="correo" autocomplete="email" placeholder="nombre@ejemplo.com">
                        </div>
                    </div>
                    <div class="cs-field">
                        <label for="password">Contraseña</label>
                        <div class="cs-field-control">
                            <svg class="ui-icon" aria-hidden="true"><use href="css/iconos.svg#candado"></use></svg>
                            <input type="password" id="password" autocomplete="current-password" placeholder="Tu contraseña">
                            <button class="cs-password-toggle" type="button" aria-controls="password" aria-label="Mostrar contraseña" data-password-label="contraseña">
                                <svg class="ui-icon" aria-hidden="true"><use href="css/iconos.svg#ojo"></use></svg>
                            </button>
                        </div>
                    </div>

                    <button class="cs-button cs-button-primary" type="submit" data-loading-label="Ingresando…">Ingresar <svg class="ui-icon" aria-hidden="true"><use href="css/iconos.svg#derecha"></use></svg></button>
                </form>
                <p class="cs-auth-switch">¿Aún no tienes cuenta? <a href="registro.html">Crear cuenta</a></p>
            </div>
        </section>
    </main>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/acceso-ui.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
