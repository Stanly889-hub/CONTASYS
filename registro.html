<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registro - CONTASYS</title>
<link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-finance">

<div class="container-center">
    <div class="card-register">

        <h1>CONTASYS</h1>
        <h2>Crear cuenta</h2>

        <form id="registroForm">

            <div class="row">
                <input type="text" id="nombre" placeholder="Nombres">
                <input type="text" id="apellido" placeholder="Apellidos">
            </div>

            <input type="text" id="cedula" placeholder="Cédula">
            <input type="date" id="fecha">

            <input type="password" id="password" placeholder="Contraseña">
            <input type="password" id="confirmPassword" placeholder="Confirmar contraseña">

            <select id="rol">
                <option value="">Seleccionar rol</option>
                <option>Administrador</option>
                <option>Contador</option>
            </select>

            <p id="errorRegistro" class="error-text"></p>

            <button type="submit">Registrarse</button>
        </form>

        <a href="index.html" class="back-link">← Volver al login</a>

    </div>
</div>

<script src="js/app.js"></script>
<script src="js/registro.js"></script>

</body>
</html>
