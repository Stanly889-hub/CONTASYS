<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0F172A">
    <title>Error de acceso | CONTASYS</title>
    <link rel="icon" href="css/marca/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/corporativo.css">
    <link rel="stylesheet" href="css/acceso-error.css">
</head>
<body class="cs-ui cs-access-error">
    <main class="error-container">
        <svg class="access-error-waves" viewBox="0 0 500 330" aria-hidden="true">
            <defs>
                <linearGradient id="errorWaveDeep" x1="0" y1="1" x2="1" y2="0" gradientUnits="objectBoundingBox">
                    <stop stop-color="#063977"/><stop offset="1" stop-color="#1D4ED8" stop-opacity=".38"/>
                </linearGradient>
                <linearGradient id="errorWaveLight" x1="0" y1="0" x2=".65" y2="1" gradientUnits="objectBoundingBox">
                    <stop stop-color="#0C3371"/><stop offset=".66" stop-color="#1252A3"/><stop offset="1" stop-color="#098EF1"/>
                </linearGradient>
            </defs>
            <path d="M0 0h500C395 118 336 101 246 137 146 177 127 271 0 330Z" fill="url(#errorWaveDeep)"/>
            <path d="M0 0h302C224 125 127 208 0 225Z" fill="url(#errorWaveLight)"/>
            <path d="M302 0C224 125 127 208 0 225" fill="none" stroke="#60A5FA" stroke-opacity=".48" stroke-width="2"/>
        </svg>
        <svg class="access-error-waves access-error-waves-bottom" viewBox="0 0 500 330" aria-hidden="true">
            <path d="M0 0h500C395 118 336 101 246 137 146 177 127 271 0 330Z" fill="url(#errorWaveDeep)"/>
            <path d="M0 0h302C224 125 127 208 0 225Z" fill="url(#errorWaveLight)"/>
            <path d="M302 0C224 125 127 208 0 225" fill="none" stroke="#60A5FA" stroke-opacity=".48" stroke-width="2"/>
        </svg>
        <section class="error-box" aria-labelledby="tituloError">
            <svg class="access-error-card-waves" viewBox="0 0 800 130" preserveAspectRatio="none" aria-hidden="true">
                <defs>
                    <linearGradient id="errorCardWave">
                        <stop stop-color="#93C5FD" stop-opacity=".53"/><stop offset=".48" stop-color="#DBEAFE" stop-opacity=".14"/><stop offset="1" stop-color="#93C5FD" stop-opacity=".48"/>
                    </linearGradient>
                </defs>
                <path d="M0 12C125 43 112 121 335 130H0Zm800-12C690 29 685 124 506 130h294Z" fill="#BFDBFE" opacity=".34"/>
                <path d="M0 50C117 120 238 100 359 130H0Zm800 12C696 69 651 120 487 130h313Z" fill="url(#errorCardWave)"/>
            </svg>
            <svg class="icon access-error-icon" viewBox="0 0 180 164" aria-hidden="true">
                <defs>
                    <linearGradient id="errorIconTile" x2="1" y2="1"><stop stop-color="#DEEDFC"/><stop offset="1" stop-color="#A9CCFA"/></linearGradient>
                    <linearGradient id="errorIconLock" x2="1" y2="1"><stop stop-color="#0C9EF7"/><stop offset="1" stop-color="#0341DA"/></linearGradient>
                </defs>
                <rect width="180" height="164" rx="45" fill="url(#errorIconTile)"/>
                <path d="M58 72V55a25 25 0 0 1 50 0v17" fill="none" stroke="url(#errorIconLock)" stroke-width="11"/>
                <rect x="40" y="67" width="86" height="68" rx="12" fill="url(#errorIconLock)"/>
                <path d="M83 105v8" stroke="#BFDBFE" stroke-width="9" stroke-linecap="round"/>
                <circle cx="83" cy="95" r="9" fill="#BFDBFE"/>
                <circle cx="135" cy="117" r="28" fill="url(#errorIconLock)" stroke="#B7D7FB" stroke-width="7"/>
                <path d="M135 105v13" stroke="white" stroke-width="6" stroke-linecap="round"/>
                <circle cx="135" cy="128" r="3.2" fill="white"/>
            </svg>
            <h1 id="tituloError">Error de acceso</h1>
            <p>No fue posible iniciar sesión. Verifica tu información e inténtalo nuevamente.</p>
            <button type="button" class="cs-button access-error-home" onclick="window.location.href='index.html'">
                <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M2.5 11.2 12 3l9.5 8.2M5.5 9.3v11h4.2v-5.6h4.6v5.6h4.2v-11"/>
                </svg>
                Volver al inicio
            </button>
        </section>
    </main>
</body>
</html>
