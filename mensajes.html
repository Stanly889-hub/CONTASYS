<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0F172A">
    <title>Chat | CONTASYS</title>
    <link rel="icon" href="css/marca/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/corporativo.css">
    <link rel="stylesheet" href="css/operaciones.css">
    <link rel="stylesheet" href="css/comunicacion.css">
</head>
<body class="cs-ui cs-dashboard cs-modulo cs-comunicacion cs-chat">
    <div class="dashboard-container">
        <aside class="sidebar" id="menuFinanciero"></aside>
        <main class="main-content">
            <header class="topbar"></header>
            <div class="cs-dashboard-content">
                <div class="cs-module-hero">
                    <div class="cs-module-hero-mark"><svg class="ui-icon" width="18" height="18" aria-hidden="true"><use href="css/iconos.svg#chat"></use></svg></div>
                    <div><h1>Chat</h1><p>Consulta tus contactos y conversaciones.</p></div>
                </div>
                <section class="chat-contenedor cs-card" id="centroChat" aria-label="Mensajería">
                    <aside class="chat-contactos" aria-labelledby="tituloContactos">
                        <h2 id="tituloContactos">Contactos</h2>
                        <div id="listaContactos"><p class="com-empty">Cargando contactos…</p></div>
                    </aside>
                    <div class="chat-panel">
                        <div class="com-chat-header">
                            <button class="cs-button cs-button-secondary com-chat-back" id="volverContactos" type="button">‹ Contactos</button>
                            <span id="chatAvatar" class="com-avatar" aria-hidden="true" hidden></span>
                            <h2 class="chat-titulo" id="chatTitulo" tabindex="-1">Selecciona un contacto para chatear</h2>
                        </div>
                        <button type="button" class="btn-accion btn-editar cs-button cs-button-secondary" id="mensajesAnteriores" hidden>Cargar anteriores</button>
                        <div class="chat-mensajes" id="chatMensajes" aria-live="polite" role="log" aria-label="Historial de mensajes" tabindex="0"></div>
                        <form class="chat-form" id="chatForm" style="display:none;">
                            <input type="text" id="chatInput" placeholder="Escribe un mensaje..." aria-label="Escribe un mensaje" autocomplete="off">
                            <button class="cs-button cs-button-primary" type="submit">Enviar <svg class="ui-icon" width="18" height="18" aria-hidden="true"><use href="css/iconos.svg#derecha"></use></svg></button>
                        </form>
                    </div>
                </section>
            </div>
        </main>
    </div>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/operaciones-ui.js"></script>
    <script src="js/comunicacion-ui.js"></script>
    <script src="js/mensajes.js"></script>
</body>
</html>
