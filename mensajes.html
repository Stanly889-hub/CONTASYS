<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat - CONTASYS</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="dashboard-container">

    <aside class="sidebar">
        <h2>CONTASYS</h2>
        <ul>
            <li data-page="dashboard"><a href="dashboard.html">🏠 Dashboard</a></li>
            <li data-page="ingresos"><a href="movimientos.html?tipo=ingreso">💰 Ingresos</a></li>
            <li data-page="egresos"><a href="movimientos.html?tipo=egreso">💸 Egresos</a></li>
            <li data-page="reportes"><a href="reportes.html">📊 Reportes</a></li>
            <li data-page="mensajes"><a href="mensajes.html">💬 Chat</a></li>
            <li data-page="cuenta"><a href="cuenta.html">📁 Mi cuenta</a></li>
            <li data-page="facturacion"><a href="facturacion.html">🧾 Facturación</a></li>
            <li data-page="presupuestos"><a href="presupuestos.html">📅 Presupuestos</a></li>
            <li data-page="analisis"><a href="analisis.html">📈 Análisis financiero</a></li>
            <li data-page="notificaciones"><a href="notificaciones.html">🔔 Notificaciones</a></li>
            <li data-rol="Administrador" data-page="usuarios"><a href="usuarios.html">👥 Usuarios</a></li>
            <li data-rol="Administrador" data-page="configuracion"><a href="configuracion.html">⚙ Configuración</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <h1>Chat</h1>
            <div class="user">
                👤 <span id="nombreUsuarioActual">Usuario</span>
                <button onclick="cerrarSesion()" class="btn-logout">Cerrar sesión</button>
            </div>
        </header>

        <section class="chat-contenedor">
            <div class="chat-contactos" id="listaContactos"></div>

            <div class="chat-panel">
                <div class="chat-titulo" id="chatTitulo">Selecciona un contacto para chatear</div>
                <div class="chat-mensajes" id="chatMensajes"></div>
                <form class="chat-form" id="chatForm" style="display:none;">
                    <input type="text" id="chatInput" placeholder="Escribe un mensaje..." autocomplete="off">
                    <button type="submit">Enviar</button>
                </form>
            </div>
        </section>
    </main>
</div>

<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/mensajes.js"></script>
</body>
</html>
